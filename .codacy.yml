---
# Codacy exclusions for generated output, local tooling, and design handoff files.
# Keep production source, tests, deployment scripts, and workflows in the scan.
exclude_paths:
  - "new-assets/**"
  - ".svelte-kit/**"
  - "build/**"
  - "dist/**"
  - "reports/**"
  - ".netlify/**"
  - ".playwright-cli/**"
  - ".impeccable/**"
  - ".codex/**"
  - ".reasonix/**"
  - ".codacy/**"
  - "node_modules/**"
