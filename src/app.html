<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121212" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    %sveltekit.head%
    <!--
      Fallback title only. SvelteKit does not deduplicate <title> elements and
      browsers use the first <title> in tree order, so this must come AFTER
      %sveltekit.head%: the per-page <title> set via svelte:head keeps
      precedence, and this one only shows for pages that render none.
    -->
    <title>Advanced Digital Marketing LTDA</title>
  </head>
  <body data-sveltekit-preload-data="hover" style="background:#121212">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
