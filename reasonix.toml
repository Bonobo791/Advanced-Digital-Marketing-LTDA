# Executor/worker model: DeepSeek Flash handles the actual implementation work.
default_model = "deepseek-flash"

[agent]
# DeepSeek Pro is the low-frequency planner; Flash stays the worker/executor.
planner_model = "deepseek-pro"
# Subagents (task/fleet) are workers too, so they also run on Flash.
subagent_model = "deepseek-flash"
# Allow fleet and several subagents: nested delegation, session-wide
# sub-agent concurrency, and parallel writers with non-overlapping write_paths.
max_subagent_depth = 2
max_subagent_concurrency = 6
max_parallel_writers = 3

[permissions]
# Deny rules are hard blocks and take precedence over allow rules: the repo
# forbids pushes (AGENTS.md: "NEVER push to the branch"), so no workflow may
# ever push — not even an explicitly approved command.
deny = ["Bash(git push*)"]
allow = ["Bash=git branch -a && echo \"---\" && git status && echo \"---\" && git log --oneline -10", "Bash=git stash list; echo \"---tags---\"; git tag; echo \"---reflog---\"; git reflog --oneline -20", "Bash=git log --oneline dev --not main 2>/dev/null | head; echo \"---main ahead of dev---\"; git log --oneline main --not dev 2>/dev/null | head; echo \"---merge-base---\"; git merge-base dev main; echo \"---upstream---\"; git rev-parse --abbrev-ref dev@{upstream} 2>/dev/null; git rev-parse --abbrev-ref main@{upstream} 2>/dev/null", "Bash=which reasonix; reasonix --help 2>&1 | head -40", "Bash=reasonix session --help 2>&1 | head -30; echo \"===list===\"; reasonix session list --json 2>&1 | head -60", "Bash=git worktree list; echo \"===branch -v===\"; git branch -v; echo \"===safe delete test===\"; git merge-base --is-ancestor main dev && echo \"main IS fully merged into dev (safe to delete)\"", "Bash=command -v podman; podman --version 2>&1 | head -5; echo \"---\"; podman info 2>&1 | head -30", "Bash=command -v node npm distrobox; ls -la $(command -v node 2>/dev/null) 2>/dev/null; echo \"---\"; node --version 2>&1 | head -5", "Bash=id; echo \"---\"; ls -ld /run/user/1000 2>&1; mount | grep -E '/run|/tmp' | head -10; echo \"---\"; df -h /run/user/1000 2>&1", "Bash=head -20 /home/user/.local/bin/node; echo \"===\"; podman info --storage-driver 2>&1 | head -5", "Bash=sudo -n true 2>&1 && echo \"SUDO: passwordless OK\" || echo \"SUDO: no passwordless\"; echo \"---\"; cat /etc/subuid /etc/subgid 2>&1; echo \"---\"; unshare -U true 2>&1 && echo \"USERNS: works\" || echo \"USERNS: blocked\"; echo \"---\"; cat /proc/sys/kernel/unprivileged_userns_clone 2>&1; cat /proc/sys/user/max_user_namespaces 2>&1", "Bash=touch /tmp/writetest && echo \"TMP: writable\"; echo \"---\"; XDG_RUNTIME_DIR=/tmp/podman-test podman info 2>&1 | head -20", "Bash(sed -n:*)", "Bash(playwright-cli:*)", "Bash(npm:*)", "Edit(src/**)", "Edit(docs/**)", "Edit(static/**)", "Edit(netlify/**)", "Edit(scripts/**)", "Edit(new-assets/**)", "Edit(AGENTS.md)", "Edit(README.md)", "Edit(package.json)", "Edit(package-lock.json)", "Edit(reasonix.toml)", "Edit(.env.example)", "Edit(.gitignore)", "Edit(netlify.toml)", "Edit(svelte.config.js)", "Edit(vite.config.ts)", "Edit(tsconfig.json)", "Edit(tailwind.config.js)", "Edit(postcss.config.js)", "Edit(vitest.config.ts)"]

[sandbox]
# Never let agent bash read the gitignored credential files; the checkout
# endpoint only reads them at runtime through SvelteKit's env loading.
forbid_read = [".env", ".env.local"]
bash = "enforce"
