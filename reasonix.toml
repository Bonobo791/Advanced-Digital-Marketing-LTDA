[permissions]
allow = ["Bash=git branch -a && echo \"---\" && git status && echo \"---\" && git log --oneline -10", "Bash=git stash list; echo \"---tags---\"; git tag; echo \"---reflog---\"; git reflog --oneline -20", "Bash=git log --oneline dev --not main 2>/dev/null | head; echo \"---main ahead of dev---\"; git log --oneline main --not dev 2>/dev/null | head; echo \"---merge-base---\"; git merge-base dev main; echo \"---remote---\"; git remote -v; echo \"---upstream---\"; git rev-parse --abbrev-ref dev@{upstream} 2>/dev/null; git rev-parse --abbrev-ref main@{upstream} 2>/dev/null", "Bash=which reasonix; reasonix --help 2>&1 | head -40", "Bash=reasonix session --help 2>&1 | head -30; echo \"===list===\"; reasonix session list --json 2>&1 | head -60", "Bash=git worktree list; echo \"===branch -v===\"; git branch -v; echo \"===safe delete test===\"; git merge-base --is-ancestor main dev && echo \"main IS fully merged into dev (safe to delete)\"", "Bash=git branch -d main && echo \"===after===\" && git branch -a && echo \"===dev untouched===\" && git log --oneline dev -3 && git status --short | head -5"]
