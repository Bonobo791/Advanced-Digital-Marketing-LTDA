[permissions]
allow = ["Bash=git branch -a && echo \"---\" && git status && echo \"---\" && git log --oneline -10", "Bash=git stash list; echo \"---tags---\"; git tag; echo \"---reflog---\"; git reflog --oneline -20", "Bash=git log --oneline dev --not main 2>/dev/null | head; echo \"---main ahead of dev---\"; git log --oneline main --not dev 2>/dev/null | head; echo \"---merge-base---\"; git merge-base dev main; echo \"---remote---\"; git remote -v; echo \"---upstream---\"; git rev-parse --abbrev-ref dev@{upstream} 2>/dev/null; git rev-parse --abbrev-ref main@{upstream} 2>/dev/null", "Bash=which reasonix; reasonix --help 2>&1 | head -40", "Bash=reasonix session --help 2>&1 | head -30; echo \"===list===\"; reasonix session list --json 2>&1 | head -60", "Bash=git worktree list; echo \"===branch -v===\"; git branch -v; echo \"===safe delete test===\"; git merge-base --is-ancestor main dev && echo \"main IS fully merged into dev (safe to delete)\"", "Bash=command -v podman; podman --version 2>&1 | head -5; echo \"---\"; podman info 2>&1 | head -30", "Bash=command -v node npm distrobox; ls -la $(command -v node 2>/dev/null) 2>/dev/null; echo \"---\"; node --version 2>&1 | head -5", "Bash=id; echo \"---\"; ls -ld /run/user/1000 2>&1; mount | grep -E '/run|/tmp' | head -10; echo \"---\"; df -h /run/user/1000 2>&1", "Bash=head -20 /home/user/.local/bin/node; echo \"===\"; podman info --storage-driver 2>&1 | head -5", "Bash=sudo -n true 2>&1 && echo \"SUDO: passwordless OK\" || echo \"SUDO: no passwordless\"; echo \"---\"; cat /etc/subuid /etc/subgid 2>&1; echo \"---\"; unshare -U true 2>&1 && echo \"USERNS: works\" || echo \"USERNS: blocked\"; echo \"---\"; cat /proc/sys/kernel/unprivileged_userns_clone 2>&1; cat /proc/sys/user/max_user_namespaces 2>&1", "Bash=touch /tmp/writetest && echo \"TMP: writable\"; echo \"---\"; XDG_RUNTIME_DIR=/tmp/podman-test podman info 2>&1 | head -20"]
